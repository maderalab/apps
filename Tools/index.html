<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Tools</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone">
        <header>
            <h1>Tools</h1>
        </header>

        <main>
            <!-- Each tool lives in its own sub-folder; the launcher just links to it. -->
            <div class="tool-grid">
                <a class="tool-tile" href="calculator/index.html">
                    <span class="tool-icon">🧮</span>
                    <span class="tool-name">Calculator</span>
                </a>
                <a class="tool-tile" href="tennis/index.html">
                    <span class="tool-icon">🎾</span>
                    <span class="tool-name">Tennis Scoreboard</span>
                </a>
                <a class="tool-tile" href="health/index.html">
                    <span class="tool-icon">❤️</span>
                    <span class="tool-name">Health</span>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
