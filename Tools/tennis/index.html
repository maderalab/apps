<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Tennis Scoreboard · Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone">
        <header>
            <a class="back-btn" href="../index.html" title="Back">‹</a>
            <h1>Tennis Scoreboard</h1>
            <span class="header-spacer"></span>
        </header>
        <main>
            <div id="root"></div>
        </main>
    </div>

    <!-- React + the compiled scorer. tennis-scorer.jsx is the source;
         tennis-scorer.js is generated from it (see README). -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="icons.js"></script>
    <script src="tennis-scorer.js"></script>
    <script>
        ReactDOM.createRoot(document.getElementById('root'))
            .render(React.createElement(TennisScorer));
    </script>
</body>
</html>
